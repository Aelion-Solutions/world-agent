# Aelion World Agent — localhost agent API
http:
  enabled: true
  # Forced to loopback; non-loopback hosts are rejected
  host: 127.0.0.1
  port: 8765
  # Blank / known placeholders are replaced with a generated secret on first enable
  token: ""

limits:
  # Max blocks scanned / filled / asserted in one region
  max_volume: 500000
  # Max edge length of a region on any axis
  max_edge: 160
  # Max entities returned
  max_entities: 250
  # Hard cap on blocks touched by a single mutating request (including batch totals)
  max_blocks_per_request: 250000
  # Max ops in POST /v1/batch
  max_batch_ops: 64

mutations:
  enabled: true

commands:
  # Allowlisted console commands for POST /v1/run (prefix match)
  allowlist:
    - "tp "
    - "teleport "
    - "say "
    - "time "
    - "weather "
    - "gamemode "
    - "worldagent "

adapters:
  # Optional POI sources from companion plugins (off by default)
  enabled: false
  apm:
    enabled: false
    # Relative to server root
    config_path: "plugins/APM/config.yml"
  aelion_npcs:
    enabled: false

markers:
  # Despawn temporary markers after N ticks (20 = 1s)
  default_lifetime_ticks: 200

transactions:
  enabled: true
  # Max undo/redo entries kept in memory
  max_stack: 30
  # Max unique blocks recorded per transaction (also bounded by max_blocks_per_request)
  max_blocks: 250000

snapshots:
  # Max in-memory snapshots; oldest are evicted
  max_entries: 16
